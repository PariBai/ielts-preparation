services:
  ielts:
    build: .
    container_name: ielts-tracker
    restart: unless-stopped
    ports:
      # Host 3200 — port 3000 on this machine is already taken by another service.
      - "3200:3000"
    volumes:
      - ielts-data:/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TUTOR_URL=http://tutor:8000
    depends_on:
      - tutor

  # AI tutor. Deliberately has NO published port: it is reachable only from the
  # `ielts` container on the internal network, which requires a login first.
  tutor:
    build: ./tutor
    container_name: ielts-tutor
    restart: unless-stopped
    env_file:
      - .env

  # Public HTTPS front door. Quick tunnels get a new random *.trycloudflare.com
  # hostname every time this container restarts:
  #   docker logs ielts-tunnel 2>&1 | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ielts-tunnel
    restart: unless-stopped
    depends_on:
      - ielts
    command: tunnel --no-autoupdate --url http://ielts:3000

volumes:
  ielts-data:
