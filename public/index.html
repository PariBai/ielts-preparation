<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>IELTS Prep Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <a class="brand" href="#/">
    <span class="brand-mark">📘</span>
    <span class="brand-text">IELTS Prep</span>
  </a>
  <div class="topbar-right">
    <span class="countdown" id="countdown"></span>
    <span class="sync" id="sync" title="Save status">saved</span>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="nav-section">
      <a class="nav-item" href="#/" data-route="/">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
    </div>
    <div class="nav-section" id="moduleNav"></div>
    <div class="nav-section">
      <a class="nav-item" href="#/settings" data-route="/settings">
        <span class="nav-icon">⚙️</span> Settings &amp; Backup
      </a>
    </div>
    <div class="nav-foot">
      Progress is saved on the server — it follows you across devices.
    </div>
  </nav>

  <div class="scrim" id="scrim"></div>

  <main class="main" id="main"></main>
</div>

<script src="content.js"></script>
<script src="vault-charts.js"></script>
<script src="vault.js"></script>
<script src="speaking.js"></script>
<script src="app.js"></script>
<script src="tutor.js"></script>
<script src="speaking-ui.js"></script>
</body>
</html>
